<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoodGarden 🌿</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --sky1: #87ceeb;
  --sky2: #dff6ff;
  --grass: #6fa968;
  --glass: rgba(255,255,255,.22);
  --text: #ffffff;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  font-family: "Trebuchet MS", Arial, sans-serif;
  color: var(--text);
  background: linear-gradient(var(--sky1), var(--sky2));
  transition: background 2s ease;
}

/* =========================
   SKY
========================= */

.sky {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: -10;
}

.sun {
  position: absolute;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: #fff4a3;
  box-shadow:
    0 0 40px #fff4a3,
    0 0 90px rgba(255,230,120,.8);
  top: 9%;
  right: 12%;
  transition: all 3s ease;
}

.moon {
  position: absolute;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 35px rgba(255,255,255,.8);
  top: 10%;
  right: 14%;
  opacity: 0;
  transition: opacity 2s;
}

.moon::after {
  content: "";
  position: absolute;
  width: 90px;
  height: 90px;
  background: #17233f;
  border-radius: 50%;
  left: 25px;
  top: -8px;
}

/* Clouds */

.cloud {
  position: absolute;
  width: 180px;
  height: 55px;
  background: rgba(255,255,255,.65);
  border-radius: 50px;
  filter: blur(1px);
  animation: cloudMove linear infinite;
}

.cloud::before,
.cloud::after {
  content: "";
  position: absolute;
  background: inherit;
  border-radius: 50%;
}

.cloud::before {
  width: 75px;
  height: 75px;
  left: 25px;
  bottom: 5px;
}

.cloud::after {
  width: 95px;
  height: 95px;
  right: 25px;
  bottom: 0;
}

.cloud1 {
  top: 17%;
  left: -220px;
  animation-duration: 65s;
}

.cloud2 {
  top: 29%;
  left: -300px;
  transform: scale(.7);
  animation-duration: 90s;
  animation-delay: 15s;
}

@keyframes cloudMove {
  from { transform: translateX(-250px); }
  to { transform: translateX(130vw); }
}

/* =========================
   GARDEN
========================= */

.garden {
  position: relative;
  min-height: 100vh;
  overflow: hidden;
}

.mountains {
  position: absolute;
  bottom: 30%;
  width: 100%;
  height: 300px;
}

.mountain {
  position: absolute;
  bottom: 0;
  width: 0;
  height: 0;
  border-left: 180px solid transparent;
  border-right: 180px solid transparent;
  border-bottom: 280px solid rgba(69,110,120,.65);
}

.m1 { left: 5%; }
.m2 { left: 35%; transform: scale(1.3); }
.m3 { right: 5%; transform: scale(.9); }

.ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 35%;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.12), transparent 10%),
    linear-gradient(#71a866, #315d38);
  border-radius: 50% 50% 0 0 / 12% 12% 0 0;
}

/* Grass */

.grass {
  position: absolute;
  bottom: 20%;
  width: 100%;
  height: 150px;
}

.blade {
  position: absolute;
  bottom: 0;
  width: 3px;
  height: 35px;
  background: #477d45;
  transform-origin: bottom;
  animation: grassWind 2s ease-in-out infinite alternate;
}

@keyframes grassWind {
  from { transform: rotate(-4deg); }
  to { transform: rotate(8deg); }
}

/* =========================
   TREES
========================= */

.tree {
  position: absolute;
  bottom: 27%;
  width: 80px;
  height: 190px;
  animation: treeSway 4s ease-in-out infinite alternate;
  transform-origin: bottom;
}

.tree .trunk {
  position: absolute;
  bottom: 0;
  left: 35px;
  width: 15px;
  height: 100px;
  background: #5a3925;
  border-radius: 10px;
}

.tree .leaf {
  position: absolute;
  width: 75px;
  height: 75px;
  background: #3f8248;
  border-radius: 50%;
}

.tree .l1 { top: 10px; left: 0; }
.tree .l2 { top: 0; left: 30px; }
.tree .l3 { top: 45px; left: 20px; }

.tree1 { left: 5%; }
.tree2 { right: 8%; transform: scale(1.25); }

@keyframes treeSway {
  from { transform: rotate(-1deg); }
  to { transform: rotate(2deg); }
}

/* =========================
   POND
========================= */

.pond {
  position: absolute;
  bottom: 7%;
  left: 50%;
  transform: translateX(-50%);
  width: 360px;
  height: 100px;
  border-radius: 50%;
  background: linear-gradient(#66c9df, #287e9b);
  box-shadow:
    inset 0 0 25px rgba(255,255,255,.3),
    0 8px 25px rgba(0,0,0,.2);
  overflow: hidden;
}

.water-shimmer {
  position: absolute;
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(
    170deg,
    transparent 0 12px,
    rgba(255,255,255,.18) 13px 15px
  );
  animation: waterMove 3s linear infinite;
}

@keyframes waterMove {
  from { transform: translateX(-30px); }
  to { transform: translateX(30px); }
}

.ripple {
  position: absolute;
  width: 10px;
  height: 5px;
  border: 2px solid rgba(255,255,255,.65);
  border-radius: 50%;
  animation: ripple 2s ease-out forwards;
}

@keyframes ripple {
  to {
    width: 100px;
    height: 40px;
    opacity: 0;
  }
}

/* =========================
   FLOWERS
========================= */

.flower {
  position: absolute;
  bottom: 20%;
  width: 20px;
  height: 80px;
  animation: flowerSway 3s ease-in-out infinite alternate;
  transform-origin: bottom;
}

.flower .stem {
  position: absolute;
  width: 4px;
  height: 70px;
  background: #35703a;
  bottom: 0;
  left: 8px;
}

.flower .head {
  position: absolute;
  top: 0;
  left: -5px;
  width: 25px;
  height: 25px;
  border-radius: 50%;
  background: #ff9acb;
  box-shadow:
    12px 0 #ff9acb,
    -12px 0 #ff9acb,
    0 12px #ff9acb,
    0 -12px #ff9acb;
}

@keyframes flowerSway {
  from { transform: rotate(-4deg); }
  to { transform: rotate(5deg); }
}

/* =========================
   FIREFLIES
========================= */

.firefly {
  position: fixed;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #fff8a8;
  box-shadow: 0 0 15px 5px rgba(255,248,168,.8);
  pointer-events: none;
  animation: fireflyMove 5s ease-in-out infinite;
}

@keyframes fireflyMove {
  0% { transform: translate(0,0); opacity:.2; }
  30% { opacity:1; }
  60% { transform: translate(40px,-70px); }
  100% { transform: translate(-30px,-120px); opacity:.1; }
}

/* =========================
   BUTTERFLIES
========================= */

.butterfly {
  position: fixed;
  font-size: 28px;
  pointer-events: none;
  animation: butterflyFloat 12s linear infinite;
}

@keyframes butterflyFloat {
  0% {
    transform: translate(-50px, 70vh) rotate(0deg);
  }
  25% {
    transform: translate(25vw, 40vh) rotate(15deg);
  }
  50% {
    transform: translate(55vw, 60vh) rotate(-10deg);
  }
  75% {
    transform: translate(80vw, 25vh) rotate(15deg);
  }
  100% {
    transform: translate(110vw, 50vh) rotate(0deg);
  }
}

/* =========================
   PETALS / LEAVES
========================= */

.petal {
  position: fixed;
  top: -30px;
  font-size: 18px;
  pointer-events: none;
  animation: falling linear forwards;
}

@keyframes falling {
  to {
    transform: translateY(110vh) rotate(720deg);
  }
}

/* =========================
   RAIN
========================= */

.rain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1s;
  z-index: 20;
}

.drop {
  position: absolute;
  width: 1px;
  height: 25px;
  background: rgba(220,240,255,.65);
  animation: rainFall linear infinite;
}

@keyframes rainFall {
  from { transform: translateY(-50px); }
  to { transform: translateY(110vh); }
}

/* =========================
   FIREPLACE
========================= */

.fireplace {
  position: absolute;
  bottom: 22%;
  right: 24%;
  font-size: 65px;
  filter: drop-shadow(0 0 15px orange);
  animation: firePulse .7s infinite alternate;
}

@keyframes firePulse {
  from { transform: scale(.95); }
  to { transform: scale(1.05); }
}

/* =========================
   UI
========================= */

.ui {
  position: relative;
  z-index: 50;
  width: min(900px, 92%);
  margin: auto;
  padding-top: 35px;
}

.panel {
  background: rgba(20,40,45,.28);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 25px;
  padding: 25px;
  box-shadow: 0 15px 50px rgba(0,0,0,.18);
}

h1 {
  font-size: clamp(2.2rem, 6vw, 4rem);
  text-align: center;
  text-shadow: 0 4px 15px rgba(0,0,0,.3);
}

.subtitle {
  text-align: center;
  margin: 8px 0 25px;
  opacity: .9;
}

.moods {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

button {
  border: none;
  padding: 11px 17px;
  border-radius: 50px;
  cursor: pointer;
  background: rgba(255,255,255,.2);
  color: white;
  font-size: 15px;
  backdrop-filter: blur(10px);
  transition: .3s;
}

button:hover {
  transform: translateY(-3px) scale(1.05);
  background: rgba(255,255,255,.35);
}

.message {
  text-align: center;
  margin-top: 20px;
  font-size: 1.2rem;
  min-height: 30px;
}

/* Controls */

.controls {
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(130px,1fr));
  gap: 10px;
}

.control {
  text-align: center;
  padding: 12px;
  border-radius: 18px;
  background: rgba(255,255,255,.12);
}

input[type="range"] {
  width: 100%;
}

/* Breathing */

.breathing {
  margin: 25px auto 5px;
  width: 110px;
  height: 110px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(255,255,255,.2);
  border: 2px solid rgba(255,255,255,.4);
  animation: breathe 8s ease-in-out infinite;
}

@keyframes breathe {
  0%,100% { transform: scale(.75); }
  50% { transform: scale(1.15); }
}

.breathText {
  text-align: center;
  font-size: 12px;
}

/* =========================
   NIGHT MODE
========================= */

body.night {
  background: linear-gradient(#091329, #17233f);
}

body.night .sun {
  opacity: 0;
}

body.night .moon {
  opacity: 1;
}

body.night .ground {
  background: linear-gradient(#263d35,#101d19);
}

body.night .mountain {
  border-bottom-color: rgba(25,42,55,.8);
}

/* =========================
   MOODS
========================= */

body.rainy {
  background: linear-gradient(#617989,#9fb4bd);
}

body.calm {
  background: linear-gradient(#76c8d7,#d6f5ed);
}

body.sunny {
  background: linear-gradient(#5fc5ed,#ffe3a1);
}

body.sad {
  background: linear-gradient(#526575,#9baab4);
}

body.energetic {
  background: linear-gradient(#ff9c54,#ffe477);
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

  .panel {
    padding: 18px;
  }

  .pond {
    width: 250px;
    height: 80px;
  }

  .tree2 {
    right: -15px;
  }

  .tree1 {
    left: -15px;
  }

  .fireplace {
    right: 5%;
    font-size: 45px;
  }

  .controls {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="sky">
  <div class="sun"></div>
  <div class="moon"></div>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
</div>

<div class="garden">

  <div class="mountains">
    <div class="mountain m1"></div>
    <div class="mountain m2"></div>
    <div class="mountain m3"></div>
  </div>

  <div class="tree tree1">
    <div class="trunk"></div>
    <div class="leaf l1"></div>
    <div class="leaf l2"></div>
    <div class="leaf l3"></div>
  </div>

  <div class="tree tree2">
    <div class="trunk"></div>
    <div class="leaf l1"></div>
    <div class="leaf l2"></div>
    <div class="leaf l3"></div>
  </div>

  <div class="ground"></div>

  <div class="grass" id="grass"></div>

  <div class="pond" id="pond">
    <div class="water-shimmer"></div>
  </div>

  <div class="fireplace" id="fireplace">🔥</div>

  <div class="rain" id="rain"></div>

</div>

<!-- UI -->

<div class="ui">

  <div class="panel">

    <h1>🌿 MoodGarden</h1>

    <div class="subtitle">
      A tiny sensory garden for your mind ✨
    </div>

    <div class="moods">

      <button onclick="setMood('happy')">
        ☀️ Happy
      </button>

      <button onclick="setMood('calm')">
        🌊 Calm
      </button>

      <button onclick="setMood('sad')">
        🌧️ Sad
      </button>

      <button onclick="setMood('anxious')">
        🌿 Anxious
      </button>

      <button onclick="setMood('energetic')">
        🌈 Energetic
      </button>

    </div>

    <div class="message" id="message">
      Welcome to your little garden. Take a breath. 🌱
    </div>

    <div class="controls">

      <div class="control">
        🌧️ Rain
        <br>
        <button onclick="toggleRain()">ON / OFF</button>
      </div>

      <div class="control">
        💧 Water
        <br>
        <button onclick="toggleSound('water')">ON / OFF</button>
      </div>

      <div class="control">
        🌬️ Wind
        <br>
        <button onclick="toggleSound('wind')">ON / OFF</button>
      </div>

      <div class="control">
        🐦 Birds
        <br>
        <button onclick="toggleSound('birds')">ON / OFF</button>
      </div>

      <div class="control">
        🔥 Fire
        <br>
        <button onclick="toggleSound('fire')">ON / OFF</button>
      </div>

      <div class="control">
        🌙 Night
        <br>
        <button onclick="toggleNight()">DAY / NIGHT</button>
      </div>

    </div>

    <div style="margin-top:20px;text-align:center">

      🔊 Master Volume

      <input
        id="volume"
        type="range"
        min="0"
        max="1"
        step=".01"
        value=".35"
      >

    </div>

    <div class="breathing">
      <div class="breathText">
        BREATHE<br>
        🌿
      </div>
    </div>

    <div style="text-align:center;margin-top:10px;opacity:.8">
      Breathe in... and let the garden breathe with you.
    </div>

  </div>

</div>

<script>

/* ==========================================
   GARDEN CREATION
========================================== */

const grass = document.getElementById("grass");

for(let i=0;i<90;i++){

  const blade=document.createElement("div");

  blade.className="blade";

  blade.style.left=Math.random()*100+"%";

  blade.style.height=(20+Math.random()*40)+"px";

  blade.style.animationDelay=Math.random()*2+"s";

  grass.appendChild(blade);
}


/* Flowers */

for(let i=0;i<18;i++){

  const flower=document.createElement("div");

  flower.className="flower";

  flower.style.left=(Math.random()*96)+"%";

  flower.style.transform=`scale(${.6+Math.random()*.6})`;

  flower.innerHTML=`
    <div class="stem"></div>
    <div class="head"></div>
  `;

  document.querySelector(".garden").appendChild(flower);
}


/* ==========================================
   FIREFLIES
========================================== */

for(let i=0;i<25;i++){

  const f=document.createElement("div");

  f.className="firefly";

  f.style.left=Math.random()*100+"%";

  f.style.top=(30+Math.random()*60)+"%";

  f.style.animationDelay=Math.random()*5+"s";

  document.body.appendChild(f);
}


/* ==========================================
   BUTTERFLIES
========================================== */

for(let i=0;i<4;i++){

  const b=document.createElement("div");

  b.className="butterfly";

  b.textContent=["🦋","🦋","🦋","🦋"][i];

  b.style.animationDelay=(i*3)+"s";

  document.body.appendChild(b);
}


/* ==========================================
   RAIN
========================================== */

const rain=document.getElementById("rain");

for(let i=0;i<130;i++){

  const drop=document.createElement("div");

  drop.className="drop";

  drop.style.left=Math.random()*100+"%";

  drop.style.animationDuration=(.4+Math.random()*.7)+"s";

  drop.style.animationDelay=Math.random()*2+"s";

  rain.appendChild(drop);
}

let rainOn=false;

function toggleRain(){

  rainOn=!rainOn;

  rain.style.opacity=rainOn ? ".8" : "0";

  if(rainOn){
    startAudio("rain");
  }else{
    stopAudio("rain");
  }
}


/* ==========================================
   MOODS
========================================== */

function setMood(mood){

  document.body.classList.remove(
    "rainy",
    "calm",
    "sunny",
    "sad",
    "energetic"
  );

  const message=document.getElementById("message");

  if(mood==="happy"){

    document.body.classList.add("sunny");

    message.textContent=
      "Let the sunlight find you. 🌞 You deserve a little joy.";

    startAudio("birds");

  }

  if(mood==="calm"){

    document.body.classList.add("calm");

    message.textContent=
      "Nothing needs to happen right now. Just breathe. 🌊";

    startAudio("water");
    startAudio("wind");

  }

  if(mood==="sad"){

    document.body.classList.add("sad");

    message.textContent=
      "It's okay to feel this way. Let the rain carry some of it away. 🌧️";

    rainOn=true;
    rain.style.opacity=".8";

    startAudio("rain");

  }

  if(mood==="anxious"){

    document.body.classList.add("calm");

    message.textContent=
      "Slow down. You are safe here. Inhale... exhale... 🌿";

    startAudio("wind");

  }

  if(mood==="energetic"){

    document.body.classList.add("energetic");

    message.textContent=
      "Feel the sunlight. Move. Explore. Be alive. 🌈";

    startAudio("birds");

  }

}


/* ==========================================
   NIGHT MODE
========================================== */

function toggleNight(){

  document.body.classList.toggle("night");

}


/* ==========================================
   CLICK WATER RIPPLE
========================================== */

const pond=document.getElementById("pond");

pond.addEventListener("click",(e)=>{

  const rect=pond.getBoundingClientRect();

  const ripple=document.createElement("div");

  ripple.className="ripple";

  ripple.style.left=(e.clientX-rect.left)+"px";

  ripple.style.top=(e.clientY-rect.top)+"px";

  pond.appendChild(ripple);

  setTimeout(()=>{
    ripple.remove();
  },2000);

});


/* ==========================================
   FALLING PETALS
========================================== */

function createPetal(){

  const petal=document.createElement("div");

  petal.className="petal";

  petal.textContent=Math.random()>.5 ? "🌸" : "🍃";

  petal.style.left=Math.random()*100+"%";

  petal.style.animationDuration=(5+Math.random()*7)+"s";

  document.body.appendChild(petal);

  setTimeout(()=>{
    petal.remove();
  },13000);
}

setInterval(createPetal,1200);


/* ==========================================
   TOUCH / MOUSE MAGIC
========================================== */

document.addEventListener("pointerdown",(e)=>{

  const sparkle=document.createElement("div");

  sparkle.style.position="fixed";

  sparkle.style.left=e.clientX+"px";

  sparkle.style.top=e.clientY+"px";

  sparkle.style.fontSize="25px";

  sparkle.style.pointerEvents="none";

  sparkle.textContent="✨";

  sparkle.style.zIndex="100";

  document.body.appendChild(sparkle);

  sparkle.animate(
    [
      {
        transform:"scale(.5)",
        opacity:1
      },
      {
        transform:"scale(2) translateY(-30px)",
        opacity:0
      }
    ],
    {
      duration:700
    }
  );

  setTimeout(()=>{
    sparkle.remove();
  },700);

});


/* ==========================================
   WEB AUDIO ENGINE
========================================== */

let audioContext;

const sounds={};

let masterVolume=.35;

document.getElementById("volume").addEventListener(
  "input",
  e=>{
    masterVolume=parseFloat(e.target.value);
  }
);


function initAudio(){

  if(!audioContext){

    audioContext=
      new (window.AudioContext ||
      window.webkitAudioContext)();

  }

  if(audioContext.state==="suspended"){
    audioContext.resume();
  }

}


/* Wind */

function startWind(){

  initAudio();

  if(sounds.wind)return;

  const buffer=
    audioContext.createBuffer(
      1,
      audioContext.sampleRate*2,
      audioContext.sampleRate
    );

  const data=buffer.getChannelData(0);

  for(let i=0;i<data.length;i++){
    data[i]=Math.random()*2-1;
  }

  const source=
    audioContext.createBufferSource();

  const filter=
    audioContext.createBiquadFilter();

  const gain=
    audioContext.createGain();

  source.buffer=buffer;
  source.loop=true;

  filter.type="lowpass";
  filter.frequency.value=700;

  gain.gain.value=.04;

  source.connect(filter);
  filter.connect(gain);
  gain.connect(audioContext.destination);

  source.start();

  sounds.wind={
    source,
    gain
  };
}


/* Water */

function startWater(){

  initAudio();

  if(sounds.water)return;

  const osc=
    audioContext.createOscillator();

  const gain=
    audioContext.createGain();

  osc.type="sine";

  osc.frequency.value=180;

  gain.gain.value=.015;

  osc.connect(gain);

  gain.connect(audioContext.destination);

  osc.start();

  sounds.water={
    osc,
    gain
  };
}


/* Birds */

function startBirds(){

  initAudio();

  if(sounds.birds)return;

  const interval=setInterval(()=>{

    if(!sounds.birds)return;

    const osc=
      audioContext.createOscillator();

    const gain=
      audioContext.createGain();

    osc.frequency.setValueAtTime(
      1000+Math.random()*900,
      audioContext.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
      1600+Math.random()*700,
      audioContext.currentTime+.15
    );

    gain.gain.setValueAtTime(
      .025*masterVolume,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioContext.currentTime+.25
    );

    osc.connect(gain);

    gain.connect(audioContext.destination);

    osc.start();

    osc.stop(
      audioContext.currentTime+.3
    );

  },3000+Math.random()*4000);

  sounds.birds={
    interval
  };
}


/* Fire */

function startFire(){

  initAudio();

  if(sounds.fire)return;

  const interval=setInterval(()=>{

    if(!sounds.fire)return;

    const osc=
      audioContext.createOscillator();

    const gain=
      audioContext.createGain();

    osc.type="triangle";

    osc.frequency.value=
      80+Math.random()*100;

    gain.gain.value=
      .01*masterVolume;

    osc.connect(gain);

    gain.connect(audioContext.destination);

    osc.start();

    osc.stop(
      audioContext.currentTime+.12
    );

  },300);

  sounds.fire={
    interval
  };
}


/* Rain */

function startRain(){

  initAudio();

  if(sounds.rain)return;

  const buffer=
    audioContext.createBuffer(
      1,
      audioContext.sampleRate,
      audioContext.sampleRate
    );

  const data=buffer.getChannelData(0);

  for(let i=0;i<data.length;i++){
    data[i]=Math.random()*2-1;
  }

  const source=
    audioContext.createBufferSource();

  const filter=
    audioContext.createBiquadFilter();

  const gain=
    audioContext.createGain();

  source.buffer=buffer;
  source.loop=true;

  filter.type="highpass";
  filter.frequency.value=900;

  gain.gain.value=.018;

  source.connect(filter);
  filter.connect(gain);
  gain.connect(audioContext.destination);

  source.start();

  sounds.rain={
    source,
    gain
  };
}


/* ==========================================
   SOUND CONTROLS
========================================== */

function startAudio(type){

  if(type==="wind") startWind();

  if(type==="water") startWater();

  if(type==="birds") startBirds();

  if(type==="fire") startFire();

  if(type==="rain") startRain();

}

function stopAudio(type){

  const sound=sounds[type];

  if(!sound)return;

  try{

    if(sound.source){
      sound.source.stop();
    }

    if(sound.osc){
      sound.osc.stop();
    }

    if(sound.interval){
      clearInterval(sound.interval);
    }

  }catch(e){}

  delete sounds[type];
}

function toggleSound(type){

  initAudio();

  if(sounds[type]){
    stopAudio(type);
  }else{
    startAudio(type);
  }

}

document.addEventListener("keydown",(e)=>{

  if(e.key.toLowerCase()==="n"){
    toggleNight();
  }

  if(e.key.toLowerCase()==="r"){

});
